<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Generator - Sole Trader Tax Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        canvas {
            border: 1px solid #ccc;
            margin: 20px 0;
        }
        button {
            background: #4F46E5;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #4338CA;
        }
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .icon-item {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>📱 App Icon Generator</h1>
    <p>This will generate all required icon sizes for your app</p>
    
    <canvas id="iconCanvas"></canvas>
    
    <div>
        <button onclick="generateAllIcons()">Generate All Icons</button>
    </div>
    
    <div id="iconList" class="icon-grid"></div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            canvas.width = size;
            canvas.height = size;
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#4F46E5');
            gradient.addColorStop(1, '#7C3AED');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Draw briefcase icon
            ctx.fillStyle = 'white';
            const iconSize = size * 0.6;
            const x = (size - iconSize) / 2;
            const y = (size - iconSize) / 2;
            
            // Briefcase body
            ctx.fillRect(x, y + iconSize * 0.3, iconSize, iconSize * 0.6);
            
            // Briefcase top
            ctx.fillRect(x + iconSize * 0.15, y + iconSize * 0.15, iconSize * 0.7, iconSize * 0.2);
            
            // Handle
            ctx.fillRect(x + iconSize * 0.35, y, iconSize * 0.3, iconSize * 0.15);
            
            // Lock
            ctx.fillStyle = '#FCD34D';
            ctx.beginPath();
            ctx.arc(size / 2, size / 2 + iconSize * 0.1, iconSize * 0.08, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function generateAllIcons() {
            const iconList = document.getElementById('iconList');
            iconList.innerHTML = '';
            
            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                drawIcon(canvas, size);
                
                // Create download link
                const link = document.createElement('a');
                link.download = `icon-${size}.png`;
                link.href = canvas.toDataURL();
                
                const item = document.createElement('div');
                item.className = 'icon-item';
                item.innerHTML = `<img src="${canvas.toDataURL()}" width="100"><br><strong>${size}x${size}</strong>`;
                
                const downloadBtn = document.createElement('button');
                downloadBtn.textContent = 'Download';
                downloadBtn.onclick = () => link.click();
                
                item.appendChild(downloadBtn);
                iconList.appendChild(item);
            });
            
            alert('Icons generated! Click Download on each icon to save them.');
        }
        
        // Show preview
        const previewCanvas = document.getElementById('iconCanvas');
        drawIcon(previewCanvas, 256);
    </script>
</body>
</html>
